<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Matrix · Controller</title>
    <style>
      *{box-sizing:border-box}
      html,body{margin:0;height:100%;background:transparent;overflow:hidden}
      body{font-family:Matrix,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none}
      /* MATRIX DOCK — slim bottom-docked strip. Icons only; the hovered / active action slides its label out. */
      .bar{position:absolute;left:6px;right:6px;bottom:6px;height:46px;display:flex;align-items:center;gap:2px;
        padding:0 6px 0 5px;background:rgba(14,20,24,.94);border:1px solid #2a3440;border-radius:23px;
        box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);
        -webkit-app-region:drag;animation:dockIn .4s cubic-bezier(.2,.8,.2,1) both;
        transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
      .bar.collapsed{transform:translateY(130%);opacity:0;pointer-events:none}
      .center{-webkit-app-region:drag;flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
        background:radial-gradient(circle at 30% 25%,#1c2a3b,#0f141d);border:1px solid #394b60;margin-right:4px}
      .center .matrix-mark,.center svg{width:28px;height:28px}
      .grp{display:flex;align-items:center;gap:2px;-webkit-app-region:no-drag}
      .box{position:relative;-webkit-app-region:no-drag;display:flex;align-items:center;justify-content:center;
        height:34px;min-width:34px;padding:0 8px;gap:0;background:transparent;border:0;border-radius:17px;color:#8ea0b4;
        cursor:pointer;font:inherit;font-size:11.5px;font-weight:650;letter-spacing:.01em;white-space:nowrap;
        transition:background .16s ease,color .16s ease,padding .22s cubic-bezier(.2,.8,.2,1)}
      .box .ic{width:18px;height:18px;display:grid;place-items:center;color:inherit;flex:none}
      .box .ic svg{width:18px;height:18px;stroke-width:1.7}
      .box .lb{max-width:0;overflow:hidden;opacity:0;margin-left:0;
        transition:max-width .24s cubic-bezier(.2,.8,.2,1),opacity .16s ease,margin .24s ease}
      .box:hover,.box:focus-visible{background:#1b2634;color:#7ab6f3;padding:0 12px 0 10px;outline:none}
      .box:hover .lb,.box:focus-visible .lb{max-width:90px;opacity:1;margin-left:7px}
      .box:active{background:#26374a}
      .box.locked{color:#5c636c;opacity:.7}
      .box.locked::after{content:'';position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;background:#e0a24a}
      .divider{-webkit-app-region:no-drag;flex:0 0 auto;width:1px;height:20px;background:#2a3440;margin:0 5px}
      .spacer{flex:1 1 auto;align-self:stretch;-webkit-app-region:drag}
      .verwrap{-webkit-app-region:drag;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 6px;cursor:grab}
      .verlogo{display:none}
      .ver{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#6e7e90;padding:3px 8px;border:1px solid #2a3440;border-radius:999px}
      .tgbtn{display:none}
      .winctl{-webkit-app-region:no-drag;flex:0 0 auto;display:flex;align-items:center;gap:4px;margin-left:2px}
      .winctl button{-webkit-app-region:no-drag;width:28px;height:28px;padding:0;display:grid;place-items:center;border-radius:50%;
        background:#181e2a;border:1px solid #2a3440;color:#8ea0b4;cursor:pointer;transition:background .14s,color .14s,border-color .14s}
      .winctl button svg{width:13px;height:13px}
      .wc-pin:hover,.wc-min:hover{background:#1b2634;border-color:#394b60;color:#7ab6f3}
      .wc-pin.pinned{background:#7ab6f3;border-color:#7ab6f3;color:#0e141a}
      .wc-close:hover{background:#7a2f3b;border-color:#a04555;color:#fff}
      @keyframes dockIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
      /* collapsed state: small floating capsule */
      .mini{position:absolute;left:5px;right:5px;bottom:7px;height:36px;display:none;align-items:center;gap:4px;padding:0 6px 0 5px;
        background:rgba(14,20,24,.94);border:1px solid #2a3440;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.45);
        -webkit-app-region:drag;cursor:grab;opacity:0;transform:translateY(14px);
        transition:opacity .28s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
      .mini.show{opacity:1;transform:none}
      .mini .m-logo{-webkit-app-region:drag;flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
        background:radial-gradient(circle at 30% 25%,#1c2a3b,#0f141d);border:1px solid #394b60}
      .mini .m-logo .matrix-mark,.mini .m-logo svg{width:16px;height:16px}
      .mini .m-drag{-webkit-app-region:drag;flex:1 1 auto;align-self:stretch;min-width:6px}
      .mini .m-expand,.mini .m-close{-webkit-app-region:no-drag;flex:0 0 auto;width:24px;height:24px;display:grid;place-items:center;
        border-radius:50%;cursor:pointer;font-size:11px;transition:background .14s,color .14s}
      .mini .m-expand{background:#7ab6f3;border:1px solid #7ab6f3;color:#0e141a}
      .mini .m-expand:hover{background:#a0ccf9}
      .mini .m-expand svg{width:14px;height:14px}
      .mini .m-close{background:#181e2a;border:1px solid #2a3440;color:#8ea0b4}
      .mini .m-close:hover{background:#7a2f3b;border-color:#a04555;color:#fff}
    </style>
    <script type="module" crossorigin src="./assets/controller-ZXi8BXUj.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/types-B0-2ZUtm.js">
    <link rel="modulepreload" crossorigin href="./assets/tamperLock-C-XpNF9g.js">
    <link rel="stylesheet" href="./matrix-theme.css">
    <script defer src="./matrix-build.js"></script>
    <script defer src="./matrix-payments.js"></script>
    <script defer src="./matrix-brand.js"></script>
  <script defer src="./matrix-trial-status.js"></script>  <link rel="stylesheet" href="./matrix-visual.css">
</head>
  <body class="matrix-controller">
    <div class="bar">
      <div class="center"><img src="./assets/matrix-mark.png" class="matrix-mark" alt="Matrix"></div>
      <div class="grp">
      <button class="box" data-action="new-form"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></svg></span><span class="lb">New Form</span></button>
      <button class="box" data-action="open-form"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="lb">Open Form</span></button>
      <button class="box" data-action="login-data"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span><span class="lb">Login Data</span></button>
      <button class="box" data-action="proxy"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg></span><span class="lb">Proxy</span></button>
      <button class="box" data-action="payment"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/><path d="M7 15h4"/></svg></span><span class="lb">Payment</span></button>
      <button class="box" data-action="history"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13a9 9 0 1 0 2.6-6.36L3 8"/><path d="M12 7v5l3 2"/></svg></span><span class="lb">Tickets</span></button>
      </div>
      <span class="divider"></span>
      <div class="grp">
      
      <button class="box" data-action="tools"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18.1V21h2.9l6.4-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.3-.6-.6-2.3z"/></svg></span><span class="lb">Tools</span></button>
      <button class="box" data-action="updates"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4v5h-5"/></svg></span><span class="lb">Updates</span></button>
      <button class="box" data-action="logs"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 16.5h7M8.5 9.5h2"/></svg></span><span class="lb">Logs</span></button>
      </div>
      <span class="spacer"></span>
      <div class="verwrap">
        <span class="verlogo"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></span>
        <span class="ver" id="appVer">V1.0.0</span>
      </div>
      <!-- OFFICIAL TELEGRAM (operator 2026-07-29): a persistent, one-click follow. Deliberately NOT one of the action
           boxes — it is not a tool, so it sits in the meta group beside the version, in Telegram's own blue so it reads
           as an external link rather than an app function. Opens in the SYSTEM app/browser via OpenExternal. -->
      <button class="tgbtn" id="tgBtn" title="Follow our official Telegram channel @Matrix">
        <span class="tg-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.94 4.6l-2.9 13.68c-.22 1-.82 1.24-1.66.77l-4.6-3.39-2.22 2.14c-.24.24-.45.45-.92.45l.33-4.68 8.5-7.68c.37-.33-.08-.51-.57-.18L6.4 12.9 1.9 11.5c-.98-.3-1-.98.2-1.45l18.1-6.98c.82-.3 1.54.2 1.27 2.03z"/></svg></span>
        <span class="tg-tx">Follow</span>
      </button>
      <div class="winctl">
        <button class="wc-pin" id="pinBtn" title="Pin on top (stays above other apps)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v3.34a2 2 0 0 1-.86 1.64l-1.28.9A2 2 0 0 0 6 13.5V15a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1.5a2 2 0 0 0-.86-1.64l-1.28-.9A2 2 0 0 1 15 9.34z"/></svg>
        </button>
        <button class="wc-min" id="minBtn" title="Minimize to a floating icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg>
        </button>
        <button class="wc-close" id="closeBtn" title="Quit Matrix">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="mini" id="mini" title="Drag to move">
      <span class="m-logo"><img src="./assets/matrix-mark.png" class="matrix-mark" alt="Matrix"></span>
      <span class="m-drag"></span>
      <button class="m-expand" id="expandBtn" title="Expand the controller">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H3v-6M21 9V3h-6M3 21l7-7M21 3l-7 7"/></svg>
      </button>
      <button class="m-close" id="miniClose" title="Quit Matrix">✕</button>
    </div>

  </body>
</html>
