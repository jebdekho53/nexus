    <script type="module" crossorigin src="./assets/history-D4ndJJYZ.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/tamperLock-C-XpNF9g.js">
    <link rel="modulepreload" crossorigin href="./assets/chrome-Cyb3f76v.js">
    <link rel="modulepreload" crossorigin href="./assets/confirm-53PaKcg4.js">

</head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>Journey Archive</span>
        <span class="sub">· your local booking records</span>
      </div>
      <span class="spacer"></span>
      <button type="button" id="deleteAllBtn" class="btn danger sm" title="Delete ALL history + free the on-disk ticket archive">🗑 Delete All</button>
      <button type="button" class="win-close" id="winClose" title="Close">✕</button>
    </header>

    <main class="hist-wrap">
      <div class="searchbar" style="display:none!important;" aria-hidden="true">
        <input id="search" type="search" />
        <span id="searchCount"></span>
        <select id="dateFilter"><option value="all" selected>All dates</option></select>
      </div>
      <div id="list"></div>
      <div id="noMatch" class="empty hidden">No journeys match these filters.</div>
      <div id="empty" class="empty hidden">Your journey archive starts with your first booking.</div>
    </main>

    <div id="toast" class="toast"></div>


  </body>
</html>
