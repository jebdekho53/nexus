  <body class="pm-page">
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>UPI Collection</span>
      </div>
      <span class="spacer"></span>
      <button type="button" id="deleteAllBtn" class="btn danger sm" title="Delete every saved payment method">Delete All</button>
      <button type="button" id="addBtn" class="btn primary sm" title="Add a new payment method">+ Add UPI ID</button>
      <button type="button" class="win-close" id="closeBtn" title="Close" onclick="window.close()">✕</button>
    </header>

    <main class="ld-wrap">
      <div id="list"></div>
      <div id="empty" class="empty hidden">
        Your UPI collection is empty. Add a UPI ID to use it in your bookings.
      </div>
    </main>

    <!-- Add / edit. ONE tab today (UPI); the tab strip exists so a card/wallet tab can be added without
         re-laying-out the dialog, and `SavedPayment.kind` already carries the discriminator. -->
    <div id="payModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-head">
          <div class="modal-title" id="modalTitle">Add UPI ID</div>
          <button type="button" class="modal-x" id="modalClose">✕</button>
        </div>
        <button type="button" id="tabUpi" hidden aria-hidden="true" style="display:none!important">UPI</button>
        <div class="modal-fields">
          <div class="field">
            <label class="lbl" for="pmUpi">UPI ID</label>
            <input type="text" id="pmUpi" placeholder="name@okhdfc" autocomplete="off" spellcheck="false" />
          </div>
          <input type="hidden" id="pmLabel" value="" />
          <div class="pm-note" id="pmNote"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn sm" id="modalCancel">Cancel</button>
          <button type="button" class="btn primary sm" id="modalSave">Save</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

  </body>
</html>
