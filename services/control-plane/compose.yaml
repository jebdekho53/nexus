services:
  matrix:
    build: .
    container_name: matrix-service
    restart: unless-stopped
    volumes:
      - /srv/matrix-data:/data
      - /srv/matrix-releases:/releases:ro
    environment:
      MATRIX_RELEASES_DIR: /releases
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
networks:
  edge:
    external: true
